[project]
name = "lens"
version = "0.1.0"
description = "Decision Flip Test: synthetic case generator and flip-test harness for handoff notes between agents"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "FNU Ratnavarma" }]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/ratnavarma/lens-flip-test"

[project.scripts]
lens = "lens:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
